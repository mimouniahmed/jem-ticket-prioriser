[project]
name = "jem-prioriser"
version = "0.1.0"
description = "Bug report prioritisation with a Joint Energy-based Model (JEM)"
readme = "README.md"
authors = [{ name = "Ahmed Mimouni" }]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "mlflow>=3.16.1",
    "pandas>=3.0.6",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
]

[project.scripts]
jem-train = "jem_prioriser.train:main"
jem-predict = "jem_prioriser.predict:main"

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
